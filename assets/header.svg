<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="340">
  <defs>
    <!-- Filtre lueur neon -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes lineFade {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }
      .bg { fill: #0b0f19; stroke: #38bdf8; stroke-width: 1.5; rx: 12px; animation: pulseGlow 4s infinite; }
      .header-bar { fill: #111827; }
      .title-text { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', monospace; font-size: 13px; fill: #94a3b8; font-weight: 600; }
      .code-font { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 13px; }
      
      .line-1 { animation: lineFade 0.6s ease-out 0.2s forwards; opacity: 0; fill: #38bdf8; }
      .line-2 { animation: lineFade 0.6s ease-out 0.7s forwards; opacity: 0; fill: #f1f5f9; }
      .line-3 { animation: lineFade 0.6s ease-out 1.2s forwards; opacity: 0; fill: #a855f7; }
      .line-4 { animation: lineFade 0.6s ease-out 1.7s forwards; opacity: 0; fill: #38bdf8; }
      .line-5 { animation: lineFade 0.6s ease-out 2.2s forwards; opacity: 0; fill: #4ade80; }
      .line-6 { animation: lineFade 0.6s ease-out 2.7s forwards; opacity: 0; fill: #cbd5e1; }
      
      .cursor {
        fill: #38bdf8;
        animation: blink 0.9s infinite;
      }
      .dot-red { fill: #ef4444; }
      .dot-yellow { fill: #eab308; }
      .dot-green { fill: #22c55e; }
      .comment { fill: #64748b; font-style: italic; }
      .accent { fill: #f59e0b; font-weight: bold; }
    </style>
  </defs>

  <!-- Arriere-plan terminal -->
  <rect class="bg" x="2" y="2" width="796" height="336" />
  
  <!-- Barre superieure de fenetre -->
  <path class="header-bar" d="M 2 14 C 2 7.37 7.37 2 14 2 L 786 2 C 792.63 2 798 7.37 798 14 L 798 38 L 2 38 Z" />
  <circle class="dot-red" cx="24" cy="20" r="5.5" />
  <circle class="dot-yellow" cx="42" cy="20" r="5.5" />
  <circle class="dot-green" cx="60" cy="20" r="5.5" />
  <text class="title-text" x="400" y="24" text-anchor="middle">ahmed@neural-engine: ~/profile/kernel.py</text>

  <!-- Lignes du terminal -->
  <g class="code-font" transform="translate(30, 45)">
    <!-- Line 1 -->
    <text class="line-1" x="0" y="35" filter="url(#neon-glow)">&gt; import intelligence as ai</text>
    <text class="line-1 comment" x="280" y="35"># Initializing core subsystems...</text>

    <!-- Line 2 -->
    <text class="line-2" x="0" y="70">&gt; engineer = ai.Agent(id="&lt;tspan class="accent"&gt;Bo7mid_BG&lt;/tspan&gt;", name="&lt;tspan class="accent"&gt;Ahmed Ben Ghanem&lt;/tspan&gt;")</text>

    <!-- Line 3 -->
    <text class="line-3" x="0" y="105">&gt; engineer.status = &lt;tspan fill="#facc15"&gt;"AI Engineering Student"&lt;/tspan&gt;</text>

    <!-- Line 4 -->
    <text class="line-4" x="0" y="140">&gt; engineer.specializations = ["Deep Learning", "Computer Vision", "LLMs &amp; Agents", "PyTorch"]</text>

    <!-- Line 5 -->
    <text class="line-5" x="0" y="175">&gt; engineer.weights = "Optimizing models &amp; building intelligent systems..."</text>

    <!-- Line 6 (Prompt + Curseur clignotant) -->
    <g class="line-6">
      <text x="0" y="225" fill="#e2e8f0">&gt; ready_for_collaboration? &lt;tspan fill="#22c55e"&gt;True&lt;/tspan&gt;</text>
      <text x="0" y="260" fill="#38bdf8">&gt; &lt;tspan fill="#94a3b8"&gt;run ./deploy_future.sh&lt;/tspan&gt;</text>
      <!-- Blinking Cursor -->
      <rect class="cursor" x="210" y="246" width="9" height="17" />
    </g>
  </g>
</svg>
